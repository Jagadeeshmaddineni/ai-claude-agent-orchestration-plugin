# =============================================================================
# agent-orch — Agent Extension Config
# =============================================================================
# Override or extend any orchestration agent. EVERYTHING here is commented out:
# a commented file behaves exactly like no file — ZERO behaviour change.
#
# Each agent supports three optional keys:
#   before:   list of globs/markdown/scripts/skill-refs run BEFORE our agent
#   replace:  if non-empty, your target REPLACES our agent for this role
#   after:    list of targets run AFTER our agent (or the replacement)
#
# Target syntax (see plugins/agent-orch/rules/extensibility.md §6):
#   /agent-orch:simplify        → invoke a skill
#   /loop ...                   → run a bounded loop
#   .loop-library/foo.yaml      → run a loop-library loop
#   scripts/foo.sh | foo.py     → run a script
#   docs/adr/*  | NOTES.md      → read-and-act on markdown
#
# Uncomment only what you want. Anything you leave commented runs as today.
# Full contract: plugins/agent-orch/rules/extensibility.md
# =============================================================================

# agents:

  # --- Worked example from the original feature request -----------------------
  # architect:
  #   before:
  #     - docs/adr/*                      # feed every ADR to the architect first
  #   replace:                            # leave empty → our architect runs
  #     #  e.g.  .claude/agents/our-architect.md   → your architect replaces ours
  #   after:
  #     - .loop-library/architect.yaml    # run a loop-library loop afterwards


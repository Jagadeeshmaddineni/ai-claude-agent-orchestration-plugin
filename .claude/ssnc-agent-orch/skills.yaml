# =============================================================================
# agent-orch — Skill Extension Config
# =============================================================================
# Add hook-point steps to any orchestration skill. EVERYTHING is commented out:
# a commented file behaves exactly like no file — ZERO behaviour change.
#
# A skill only honours hook points it explicitly exposes (see each skill's
# "## Extensibility" section). Targets at a hook point run in listed order.
#
# Target syntax (see plugins/agent-orch/rules/extensibility.md §6):
#   scripts/foo.sh | foo.py    → run a script step
#   docs/checklist.md | *.md   → read-and-act on markdown
#   .loop-library/foo.yaml     → run a loop-library loop
#   /agent-orch:simplify       → invoke a skill inline
#
# Full contract: plugins/agent-orch/rules/extensibility.md
# =============================================================================

# skills:

  # --- /make — exposes before_commit, before_pr, after_pr ---------------------
  # make:
  #   before_commit:                       # after /build, before staging+commit
  #     - scripts/format.sh
  #   before_pr:                           # after push, before `gh pr create`
  #     - .loop-library/pre-pr-review.yaml #   run a bounded review loop
  #     - docs/checklists/pr-ready.md      #   then read-and-act a checklist
  #   after_pr:                            # after the PR is opened
  #     - scripts/notify-team.sh

  # --- /build — exposes before_plan, after_plan, before_review, after_build ---
  # build:
  #   before_plan:  [docs/standards/architecture.md]
  #   after_build:  [/agent-orch:simplify]

  # --- /make-clean — exposes before_merge, after_merge ------------------------
  # make-clean:
  #   before_merge: [scripts/final-checks.sh]

  # --- /make-validate — exposes before_validate, after_validate ---------------
  # make-validate:
  #   after_validate: [scripts/upload-coverage.sh]

  # --- Other skills: each exposes a `before` / `after` pair around its work ----
  # Uncomment a skill and add `before:` / `after:` lists as needed.
